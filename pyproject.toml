[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kharkiv-metro-graph"
version = "0.1.0"
description = "Аналіз графа Харківського метрополітену: візуалізація, BFS/DFS, Дейкстра."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["graph-theory", "networkx", "metro", "kharkiv", "dijkstra", "bfs", "dfs"]
dependencies = [
    "networkx>=3.0",
    "matplotlib>=3.5",
    "numpy>=1.23",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "ipykernel>=6.0"]

[tool.setuptools.packages.find]
include = ["kharkiv_metro*"]
exclude = ["scripts*", "notebooks*", "images*"]
